services:
  - type: web
    name: foosball-rankings
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: foosball-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DB_PATH
        value: /data/foosball.db
      - key: NODE_ENV
        value: production
